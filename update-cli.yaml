schemaVersion: 2
project:
  name: iPhone Photo Organizer
  type: go
  description: Build, test, and install Go CLI and native macOS ImageCaptureCore importer
variables:
  binary: photo-organizer
  distDir: dist
defaults:
  failFast: true
  timeout: 10m
requirements:
  commands: [go, exiftool]
run:
  command: ./dist/photo-organizer
  cwd: .
workflows:
  setup:
    tasks: [install]
  ci:
    tasks: [verify]
tasks:
  test:
    steps:
      - id: test
        name: Go tests
        shell: go test ./...
      - id: vet
        name: Go static analysis
        go:
          action: vet
  build:
    requires: [test]
    steps:
      - id: build
        name: Build CLI and macOS helper
        shell: bash scripts/build.sh
  verify:
    requires: [build]
    steps:
      - id: executable
        name: Verify compiled Go binary
        assert:
          executable: dist/photo-organizer
      - id: version
        name: Verify binary version
        shell: ./dist/photo-organizer --version
      - id: macos-helper
        name: Verify native helper when running on macOS
        shell: |
          if [ "$(uname -s)" = Darwin ]; then test -x dist/photo-organizer-import; fi
  install:
    requires: [verify]
    steps:
      - id: install
        name: Install Go CLI
        deploy:
          source: dist/photo-organizer
          target: /usr/local/bin/photo-organizer
          mode: "0755"
      - id: install-native
        name: Install native ImageCaptureCore helper on macOS
        shell: |
          if [ "$(uname -s)" = Darwin ]; then
            install -m 0755 dist/photo-organizer-import /usr/local/bin/photo-organizer-import
          fi
